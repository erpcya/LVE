# This is a basic workflow to help you get started with Actions
# This file was contributed by Carlos Parada and Yamel Senih from ERP Consultores y Asociados, C.A

name: Publish With gradle to maven central

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the develop branch
  release:
    types: 
      - published

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  publish-sonatype:
    name: Publish Project (Sonatype)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-package: 'jdk'
          java-version: 17
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew publish
        env:
          #  To resolve withholding-engine from this organization's packages.
          GITHUB_DEPLOY_USER: ${{ github.actor }}
          GITHUB_DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          ORG_GRADLE_PROJECT_deployVersion: ${{ github.event.release.tag_name }}
          ORG_GRADLE_PROJECT_deployPublishUrl: ${{ secrets.DEPLOY_PUBLISH_SONATYPE_URL }}
          ORG_GRADLE_PROJECT_deploySigningKey: ${{ secrets.PGP_SECRET }}
          ORG_GRADLE_PROJECT_deploySigningPassword: ${{ secrets.PGP_PASSPHRASE }}
          ORG_GRADLE_PROJECT_deployUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_deployPassword: ${{ secrets.OSSRH_TOKEN }}
  publish-github:
    name: Publish Project (Github)
    runs-on: ubuntu-latest
    #  Without this the run's own token cannot write a package, and neither can any
    #  other: a workflow's default permissions are read-only, and the publish fails
    #  with a 401 that reads as a bad credential rather than a missing grant.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-package: 'jdk'
          java-version: 17
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew publish
        env:
          #  To resolve withholding-engine from this organization's packages.
          GITHUB_DEPLOY_USER: ${{ github.actor }}
          GITHUB_DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          ORG_GRADLE_PROJECT_deployVersion: ${{ github.event.release.tag_name }}
          ORG_GRADLE_PROJECT_deployPublishUrl: ${{ secrets.DEPLOY_PUBLISH_GITHUB_URL || 'https://maven.pkg.github.com/erpcya/LVE' }}
          ORG_GRADLE_PROJECT_deploySigningKey: ${{ secrets.PGP_SECRET }}
          ORG_GRADLE_PROJECT_deploySigningPassword: ${{ secrets.PGP_PASSPHRASE }}
          ORG_GRADLE_PROJECT_deployUsername: "${{ github.actor }}"
          #  The run's own token: this job publishes to this repository's own
          #  packages and the run's token is scoped to exactly that.
          ORG_GRADLE_PROJECT_deployPassword: "${{ secrets.GITHUB_TOKEN }}"

# Managed by Jarvis. Do not edit this block manually.
  notify-jarvis-result:
    name: Informar resultado de publicación a Jarvis
    # Wait for every pre-existing job and report their aggregate real result.
    if: ${{ always() && github.event_name == 'release' }}
    needs: [publish-sonatype, publish-github]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enviar resultado real a Jarvis
        env:
          JARVIS_ACTION_RESULT_URL: "http://app-server-4.erpcya.com:3000/webhook/action-result"
          JARVIS_RELEASE_TAG: "${{ github.event.release.tag_name }}"
          JARVIS_NEEDS_JSON: '${{ toJSON(needs) }}'
        run: |
          JARVIS_STATUS=$(jq -r '
            if all(.[]; .result == "success") then "success"
            elif any(.[]; .result == "failure") then "failure"
            elif any(.[]; .result == "cancelled") then "cancelled"
            else "skipped"
            end
          ' <<< "$JARVIS_NEEDS_JSON")

          payload=$(jq -nc \
            --arg repo "${{ github.repository }}" \
            --arg status "$JARVIS_STATUS" \
            --arg tag "$JARVIS_RELEASE_TAG" \
            --arg run_id "${{ github.run_id }}" \
            '{repo: $repo, status: $status, tag: $tag, run_id: $run_id}')

          curl --fail-with-body --retry 2 --retry-delay 2 \
            -X POST "$JARVIS_ACTION_RESULT_URL" \
            -H "Content-Type: application/json" \
            --data "$payload"
